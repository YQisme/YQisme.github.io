{{/* 全屏粒子连线背景，鼠标附近引力与连线高亮；画布 pointer-events: none，不阻挡点击 */}}
<canvas id="particles-bg" class="particles-bg" aria-hidden="true"></canvas>
<style>
.particles-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}
/* 全站：页眉、主栏、页脚叠在画布之上（勿改 .top-link：主题用 position:fixed; z-index:99） */
.header,
.main,
.footer {
  position: relative;
  z-index: 1;
}
</style>
<script>
(function () {
  var canvas = document.getElementById('particles-bg');
  if (!canvas || !canvas.getContext) return;

  var ctx = canvas.getContext('2d');
  var dpr = 1;
  var W = 0;
  var H = 0;
  var particles = [];
  var mouse = { x: null, y: null, active: false };
  var rafId = null;

  var COUNT = 72;
  var LINK_DIST = 140;
  var MOUSE_DIST = 220;
  var MOUSE_FORCE = 0.045;
  var FRICTION = 0.98;
  var SPEED = 0.35;

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function initParticles() {
    particles.length = 0;
    var n = Math.min(COUNT, Math.floor((W * H) / 18000));
    n = Math.max(n, 28);
    for (var i = 0; i < n; i++) {
      particles.push({
        x: rand(0, W),
        y: rand(0, H),
        vx: rand(-SPEED, SPEED),
        vy: rand(-SPEED, SPEED)
      });
    }
  }

  function onMove(e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  }

  function onLeave() {
    mouse.active = false;
  }

  function step() {
    var i, j, p, q, dx, dy, dist, t;

    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      if (mouse.active && mouse.x != null) {
        dx = mouse.x - p.x;
        dy = mouse.y - p.y;
        dist = Math.sqrt(dx * dx + dy * dy) || 1;
        if (dist < MOUSE_DIST) {
          t = (1 - dist / MOUSE_DIST) * MOUSE_FORCE;
          p.vx += (dx / dist) * t;
          p.vy += (dy / dist) * t;
        }
      }
      p.vx *= FRICTION;
      p.vy *= FRICTION;
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) { p.x = 0; p.vx *= -0.6; }
      if (p.x > W) { p.x = W; p.vx *= -0.6; }
      if (p.y < 0) { p.y = 0; p.vy *= -0.6; }
      if (p.y > H) { p.y = H; p.vy *= -0.6; }
    }

    ctx.clearRect(0, 0, W, H);

    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      for (j = i + 1; j < particles.length; j++) {
        q = particles[j];
        dx = p.x - q.x;
        dy = p.y - q.y;
        dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST) {
          var alpha = (1 - dist / LINK_DIST) * 0.12;
          if (mouse.active && mouse.x != null) {
            var mx = (p.x + q.x) / 2 - mouse.x;
            var my = (p.y + q.y) / 2 - mouse.y;
            var md = Math.sqrt(mx * mx + my * my);
            if (md < MOUSE_DIST) alpha += (1 - md / MOUSE_DIST) * 0.18;
          }
          ctx.strokeStyle = 'rgba(100, 100, 120, ' + Math.min(alpha, 0.35) + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }

    ctx.fillStyle = 'rgba(120, 120, 140, 0.45)';
    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }

    if (mouse.active && mouse.x != null) {
      ctx.strokeStyle = 'rgba(150, 150, 170, 0.25)';
      ctx.lineWidth = 1;
      for (i = 0; i < particles.length; i++) {
        p = particles[i];
        dx = mouse.x - p.x;
        dy = mouse.y - p.y;
        dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < MOUSE_DIST && dist > 1) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
      }
    }

    rafId = requestAnimationFrame(step);
  }

  function start() {
    resize();
    initParticles();
    if (rafId) cancelAnimationFrame(rafId);
    step();
  }

  window.addEventListener('resize', function () {
    resize();
    initParticles();
  });
  window.addEventListener('mousemove', onMove, { passive: true });
  document.addEventListener('mouseleave', onLeave);
  window.addEventListener('blur', onLeave);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
