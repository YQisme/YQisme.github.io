name: Deploy site

on:
  push:
    branches:
      - main
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # 关键：加载主题
          fetch-depth: 0 # 完整历史：供 git-restore-mtime 与 Hugo :git 使用

      - name: Restore Git file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure page-bundle index.md
        run: node scripts/ensure-index.mjs

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public